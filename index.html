<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>YutongPortfolio — Yutong</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="hero">
      <div class="container">
        <h1>YutongPortfolio</h1>
        <p class="tagline">Frontend developer — building fast, accessible web experiences.</p>
        <div class="controls">
          <input id="search" placeholder="Search projects..." aria-label="Search projects" />
          <select id="filter">
            <option value="all">All</option>
          </select>
          <button id="themeToggle" class="btn btn-small">Toggle Theme</button>
        </div>
      </div>
    </header>
    <canvas id="bg-canvas" aria-hidden="true"></canvas>
    <div class="blob b1" aria-hidden="true"></div>
    <div class="blob b2" aria-hidden="true"></div>
    <div class="blob b3" aria-hidden="true"></div>

    <main class="container">
      <section id="projects">
        <h2>Selected Projects</h2>
        <div id="projects-list" class="projects-grid" aria-live="polite"></div>
      </section>

      <section id="about">
        <h2>About</h2>
        <p id="bio">A concise bio that highlights skills, focus areas, and contact preference.</p>
      </section>

      <section id="contact">
        <h2>Contact</h2>
        <p>Email: <a href="mailto:you@example.com">you@example.com</a></p>
        <p>Or find me on <a href="#">GitHub</a> · <a href="#">LinkedIn</a></p>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">© <span id="year"></span> Yutong</div>
    </footer>

    <template id="project-template">
      <article class="card project-card">
        <h3 class="project-title"></h3>
        <p class="project-desc"></p>
        <div class="project-meta">
          <span class="tags"></span>
        </div>
        <div class="project-links">
          <a class="live-link" target="_blank" rel="noopener">Live</a>
          <a class="source-link" target="_blank" rel="noopener">Source</a>
        </div>
      </article>
    </template>

    <script>
      document.getElementById('year').textContent = new Date().getFullYear();
    </script>
    <script src="/bg.js" defer></script>
    <script src="/scripts.js" defer></script>
  </body>
</html>
